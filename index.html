<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online - BodyPaint</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header>
        <div class="header-container">
            <div class="logo">Body Paint</div>
            
            <nav id="nav">
                <ul id="navMenu"></ul>

                <div class="user-info" id="userInfo" style="display: none;">
                    <span>Bienvenido <strong id="userName"></strong></span>
                    <span class="user-badge" id="userRole"></span>
                    <button class="logout-btn" id="logoutBtn">Cerrar Sesión</button>
                </div>
            </nav>
        </div>
    </header>

    <main id="mainContent">
        <div id="authView" class="auth-container">

            <!-- LOGIN -->
            <form class="auth-form" id="loginForm">
                <h2>Iniciar Sesión</h2>

                <button type="button" class="btn btn-primary" id="btn-usuario">
                    Usuario
                </button>

                <button type="button" class="btn btn-primary" id="btn-admin">
                    Admin
                </button>

                <div class="form-toggle">
                    ¿No tienes cuenta?
                    <a href="#" id="toggleAuth">Registrate acá</a>
                </div>
            </form>

            <!-- REGISTRO -->
            <form class="auth-form" id="registerForm" style="display:none;">
                <h2>Registrarse</h2>

                <div class="form-group">
                    <label for="registerName">Nombre:</label>
                </div>

                <div class="form-group">
                    <label for="registerSurname">Apellido:</label>
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email:</label>
                    <input type="email" id="registerEmail" name="email" required>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Contraseña:</label>
                    <input 
                        type="password" 
                        id="registerPassword" 
                        name="password"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary" id="btn-registrar">
                    Registrarse
                </button>

                <div class="form-toggle">
                    ¿Ya tienes cuenta?
                    <a href="#" id="toggleAuthBack">Inicia sesión aquí</a>
                </div>
            </form>

        </div>

        <!-- ADMIN -->
        <div id="adminDashboardView" style="display: none;">
            <div class="container">
                <h2>Panel Admin</h2>
                <p>Vista exclusiva para administradores</p>
            </div>
        </div>

        <!-- USER -->
        <div id="dashboardView" style="display: none;">
            <div class="container">
                <h2>Panel Usuario</h2>
                <p>Listado de productos</p>
            </div>
        </div>
    </main>

    <script type="module" src="./js/main.js"></script>
</body>

</html>
